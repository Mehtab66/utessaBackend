spring.application.name=crm-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/utessa_crm
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.prefer_native_enum_types=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=${SERVER_PORT:8080}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Application
app.trial.days=14

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.com.crm.crm_backend=INFO

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Sample data seeding
app.sample-data.seed-org-slug=${SEED_ORG_SLUG:}
app.sample-data.seed-owner-email=${SEED_OWNER_EMAIL:}

# SMTP configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender
app.mail.from=${MAIL_FROM}

# RingCentral phone system (client id/secret come from .env)
ringcentral.enabled=${RINGCENTRAL_ENABLED:false}
ringcentral.client-id=${RINGCENTRAL_CLIENT_ID:}
ringcentral.client-secret=${RINGCENTRAL_CLIENT_SECRET:}
ringcentral.server=${RINGCENTRAL_SERVER:production}
ringcentral.redirect-uri=${RINGCENTRAL_REDIRECT_URI:}
ringcentral.frontend-url=${RINGCENTRAL_FRONTEND_URL:}
ringcentral.from-number=${RINGCENTRAL_FROM_NUMBER:}
# How often the call log and inbound texts are pulled from RingCentral (ms)
ringcentral.sync-interval-ms=${RINGCENTRAL_SYNC_INTERVAL_MS:45000}
# Stripe Billing (keys and price/product IDs come from .env — never commit real values)
billing.secret-key=${STRIPE_SECRET_KEY:}
billing.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
billing.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
billing.currency=${STRIPE_CURRENCY:usd}
billing.trial-days=${app.trial.days}
billing.trial-max-members=${BILLING_TRIAL_MAX_MEMBERS:10}
billing.grace-period-days=${BILLING_GRACE_PERIOD_DAYS:7}
billing.frontend-url=${BILLING_FRONTEND_URL:http://localhost:5173}
billing.connect-timeout-ms=10000
billing.read-timeout-ms=30000
# How often billing operations with an unknown outcome are checked against Stripe (ms)
billing.reconcile-interval-ms=${BILLING_RECONCILE_INTERVAL_MS:120000}
billing.prices.crm.monthly=${STRIPE_PRICE_CRM_MONTHLY:}
billing.prices.crm.yearly=${STRIPE_PRICE_CRM_YEARLY:}
billing.prices.ops.monthly=${STRIPE_PRICE_OPS_MONTHLY:}
billing.prices.ops.yearly=${STRIPE_PRICE_OPS_YEARLY:}
billing.prices.mkt.monthly=${STRIPE_PRICE_MKT_MONTHLY:}
billing.prices.mkt.yearly=${STRIPE_PRICE_MKT_YEARLY:}
billing.prices.tc.monthly=${STRIPE_PRICE_TC_MONTHLY:}
billing.prices.tc.yearly=${STRIPE_PRICE_TC_YEARLY:}
billing.prices.seat.monthly=${STRIPE_PRICE_SEAT_MONTHLY:}
billing.prices.seat.yearly=${STRIPE_PRICE_SEAT_YEARLY:}
