spring.application.name=crm-backend

# PostgreSQL — create DB first: CREATE DATABASE utessa_crm;
# URL is fixed here so a machine-level DB_URL (e.g. old crm_db) cannot override .env
spring.datasource.url=jdbc:postgresql://localhost:5432/utessa_crm
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway migrations only (never update/create via Hibernate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.prefer_native_enum_types=true


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=${SERVER_PORT:8080}

app.jwt.secret=UtessaDevSecretKeyChangeMeToALongRandomStringAtLeast256Bits!!
app.jwt.expiration-ms=86400000
app.trial.days=14
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:*,http://127.0.0.1:*

logging.level.com.crm.crm_backend=INFO

# Fax documents (phone workspace)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# One-time local seeding of CRM sample data (see SampleDataSeeder). Leave blank in shared environments.
app.sample-data.seed-org-slug=
app.sample-data.seed-owner-email=
