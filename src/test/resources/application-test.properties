# Test profile: separate database, no real Stripe / RingCentral / mail traffic.
# DB_USERNAME / DB_PASSWORD / JWT_SECRET still come from .env (spring-dotenv).
# Create the database once:  CREATE DATABASE utessa_crm_test;
spring.datasource.url=jdbc:postgresql://localhost:5432/utessa_crm_test

# Stripe is mocked in tests (StripeGateway / PricingCatalog are @MockitoBean); these values only
# make billing count as "configured" and let webhook signatures be verified.
billing.secret-key=sk_test_unit_tests_only
billing.publishable-key=pk_test_unit_tests_only
billing.webhook-secret=whsec_test_integration_secret
billing.trial-max-members=10
billing.grace-period-days=7
billing.reconcile-interval-ms=3600000
billing.webhook-retry-interval-ms=3600000

ringcentral.enabled=false
app.sample-data.seed-org-slug=
app.sample-data.seed-owner-email=
spring.mail.host=127.0.0.1
spring.mail.port=1
management.health.mail.enabled=false
logging.level.com.crm.crm_backend=WARN
